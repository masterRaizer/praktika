<polyline points="850.0,380.0 920.0,380.0 920.0,655.0 990.0,655.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="892.7" y="498.5" width="54.7" height="15" fill="#FFFFFF" opacity="0.92"/>
<text x="920.0" y="509.5" font-size="11.5" text-anchor="middle" fill="#475569">Удалить</text>
<rect x="170" y="90" width="180" height="46" rx="23.0" fill="#1F2937" stroke="#1F2937" stroke-width="1.6"/>
<text x="260.0" y="118.0" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Запуск программы</text>
<rect x="140" y="200" width="240" height="120" rx="10" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.6"/>
<path d="M140,230 L140,210 Q140,200 150,200 L370,200 Q380,200 380,210 L380,230 L140,230 Z" fill="#DCE9FA" stroke="#2B4C7E" stroke-width="1.6"/>
<text x="260.0" y="220" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Форма 1. Вход</text>
<text x="152" y="249" font-size="12" fill="#1F2937">эл. почта и пароль,</text>
<text x="152" y="266" font-size="12" fill="#1F2937">проверка подключения</text>
<text x="152" y="283" font-size="12" fill="#1F2937">к базе данных</text>
<rect x="140" y="430" width="240" height="100" rx="10" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.6"/>
<path d="M140,460 L140,440 Q140,430 150,430 L370,430 Q380,430 380,440 L380,460 L140,460 Z" fill="#DCE9FA" stroke="#2B4C7E" stroke-width="1.6"/>
<text x="260.0" y="450" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Форма 2. Регистрация</text>
<text x="152" y="479" font-size="12" fill="#1F2937">новый зритель,</text>
<text x="152" y="496" font-size="12" fill="#1F2937">пароль → хеш</text>
<rect x="140" y="620" width="240" height="100" rx="10" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.6"/>
<path d="M140,650 L140,630 Q140,620 150,620 L370,620 Q380,620 380,630 L380,650 L140,650 Z" fill="#DCE9FA" stroke="#2B4C7E" stroke-width="1.6"/>
<text x="260.0" y="640" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Форма 3. Подключение</text>
<text x="152" y="669" font-size="12" fill="#1F2937">имя сервера SQL Server,</text>
<text x="152" y="686" font-size="12" fill="#1F2937">кнопка «Проверить»</text>
<rect x="170" y="840" width="180" height="46" rx="23.0" fill="#1F2937" stroke="#1F2937" stroke-width="1.6"/>
<text x="260.0" y="868.0" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Выход из программы</text>
<rect x="540" y="180" width="310" height="220" rx="10" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.6"/>
<path d="M540,210 L540,190 Q540,180 550,180 L840,180 Q850,180 850,190 L850,210 L540,210 Z" fill="#DCE9FA" stroke="#2B4C7E" stroke-width="1.6"/>
<text x="695.0" y="200" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Форма 4. Главное окно</text>
<text x="552" y="229" font-size="12" fill="#1F2937">боковая панель разделов:</text>
<text x="552" y="246" font-size="12" fill="#1F2937">• Главная — показатели, афиша</text>
<text x="552" y="263" font-size="12" fill="#1F2937">• Фильмы</text>
<text x="552" y="280" font-size="12" fill="#1F2937">• Сеансы</text>
<text x="552" y="297" font-size="12" fill="#1F2937">• Заказы / Мои заказы</text>
<text x="552" y="314" font-size="12" fill="#1F2937">• Пользователи (администратор)</text>
<rect x="540" y="600" width="310" height="110" rx="10" fill="#FFFFFF" stroke="#B4234A" stroke-width="1.6"/>
<path d="M540,630 L540,610 Q540,600 550,600 L840,600 Q850,600 850,610 L850,630 L540,630 Z" fill="#FBE0E6" stroke="#B4234A" stroke-width="1.6"/>
<text x="695.0" y="620" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Сообщение об ошибке</text>
<text x="552" y="649" font-size="12" fill="#1F2937">понятный текст на русском,</text>
<text x="552" y="666" font-size="12" fill="#1F2937">«Подробнее» — номер ошибки</text>
<text x="552" y="683" font-size="12" fill="#1F2937">без паролей и строки подключения</text>
<rect x="990" y="90" width="260" height="80" rx="10" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.6"/>
<path d="M990,120 L990,100 Q990,90 1000,90 L1240,90 Q1250,90 1250,100 L1250,120 L990,120 Z" fill="#DCE9FA" stroke="#2B4C7E" stroke-width="1.6"/>
<text x="1120.0" y="110" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Форма 5. Фильм</text>
<text x="1002" y="139" font-size="12" fill="#1F2937">добавление и изменение</text>
<rect x="990" y="200" width="260" height="80" rx="10" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.6"/>
<path d="M990,230 L990,210 Q990,200 1000,200 L1240,200 Q1250,200 1250,210 L1250,230 L990,230 Z" fill="#DCE9FA" stroke="#2B4C7E" stroke-width="1.6"/>
<text x="1120.0" y="220" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Форма 6. Сеанс</text>
<text x="1002" y="249" font-size="12" fill="#1F2937">добавление и изменение</text>
<rect x="990" y="310" width="260" height="80" rx="10" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.6"/>
<path d="M990,340 L990,320 Q990,310 1000,310 L1240,310 Q1250,310 1250,320 L1250,340 L990,340 Z" fill="#DCE9FA" stroke="#2B4C7E" stroke-width="1.6"/>
<text x="1120.0" y="330" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Форма 8. Статус заказа</text>
<text x="1002" y="359" font-size="12" fill="#1F2937">кассир, администратор</text>
<rect x="990" y="420" width="260" height="80" rx="10" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="1.6"/>
<path d="M990,450 L990,430 Q990,420 1000,420 L1240,420 Q1250,420 1250,430 L1250,450 L990,450 Z" fill="#DCE9FA" stroke="#2B4C7E" stroke-width="1.6"/>
<text x="1120.0" y="440" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Форма 7. Пользователь</text>
<text x="1002" y="469" font-size="12" fill="#1F2937">только администратор</text>
<rect x="990" y="600" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#2F7A47" stroke-width="1.6"/>
<path d="M990,630 L990,610 Q990,600 1000,600 L1240,600 Q1250,600 1250,610 L1250,630 L990,630 Z" fill="#DDF1E3" stroke="#2F7A47" stroke-width="1.6"/>
<text x="1120.0" y="620" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Подтверждение</text>
<text x="1002" y="649" font-size="12" fill="#1F2937">удаление записи,</text>
<text x="1002" y="666" font-size="12" fill="#1F2937">блокировка, выход;</text>
<text x="1002" y="683" font-size="12" fill="#1F2937">запрет при связанных данных</text>
<rect x="1290" y="90" width="270" height="300" rx="10" fill="#FFFFFF" stroke="#2F7A47" stroke-width="1.6"/>
<path d="M1290,120 L1290,100 Q1290,90 1300,90 L1550,90 Q1560,90 1560,100 L1560,120 L1290,120 Z" fill="#DDF1E3" stroke="#2F7A47" stroke-width="1.6"/>
<text x="1425.0" y="110" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">Права ролей</text>
<text x="1302" y="139" font-size="12" fill="#1F2937">Зритель:</text>
<text x="1302" y="156" font-size="12" fill="#1F2937">  Главная, Фильмы и Сеансы —</text>
<text x="1302" y="173" font-size="12" fill="#1F2937">  просмотр, Мои заказы</text>
<text x="1302" y="190" font-size="12" fill="#1F2937">Кассир:</text>
<text x="1302" y="207" font-size="12" fill="#1F2937">  + все заказы, смена статуса</text>
<text x="1302" y="224" font-size="12" fill="#1F2937">Администратор:</text>
<text x="1302" y="241" font-size="12" fill="#1F2937">  + добавление, изменение</text>
<text x="1302" y="258" font-size="12" fill="#1F2937">  и удаление фильмов,</text>
<text x="1302" y="275" font-size="12" fill="#1F2937">  сеансов, заказов;</text>
<text x="1302" y="292" font-size="12" fill="#1F2937">  раздел Пользователи</text>
</svg>