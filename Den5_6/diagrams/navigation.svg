<polyline points="850.0,300.0 990.0,350.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="869.3" y="306.0" width="101.4" height="15" fill="#FFFFFF" opacity="0.92"/>
<text x="920.0" y="317.0" font-size="11.5" text-anchor="middle" fill="#475569">Сменить статус</text>
