<text x="460.0" y="222.0" font-size="11.5" text-anchor="middle" fill="#475569">вход выполнен</text>
<polyline points="540.0,275.0 380.0,275.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="432.7" y="256.0" width="54.7" height="15" fill="#FFFFFF" opacity="0.92"/>
<text x="460.0" y="267.0" font-size="11.5" text-anchor="middle" fill="#475569">«Выйти»</text>
<polyline points="380.0,305.0 470.0,305.0 470.0,655.0 540.0,655.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<rect x="416.0" y="461.0" width="108.0" height="15" fill="#FFFFFF" opacity="0.92"/>
<text x="470.0" y="472.0" font-size="11.5" text-anchor="middle" fill="#475569">нет подключения</text>
<polyline points="695.0,400.0 695.0,600.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<rect x="654.3" y="481.0" width="81.4" height="15" fill="#FFFFFF" opacity="0.92"/>
<text x="695.0" y="492.0" font-size="11.5" text-anchor="middle" fill="#475569">ошибка базы</text>
<polyline points="850.0,220.0 990.0,130.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
