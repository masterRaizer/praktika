<text x="1395.0" y="656.4" font-family="DejaVu Sans" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">sqlcmd -S "(localdb)\MSSQLLocalDB" -E</text><text x="1395.0" y="673.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">-b -f 65001 -i &lt;файл&gt;</text>
