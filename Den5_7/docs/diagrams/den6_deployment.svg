<text x="972.0" y="440.0" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="end">GET /api/clients/{id}</text>
<rect x="1400.0" y="322.0" width="56.4" height="18.5" fill="#FFFFFF" fill-opacity="0.92"/>
