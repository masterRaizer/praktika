<text x="1150.0" y="109.0" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="start">SQL Server (LocalDB, Express или полный)</text>
<text x="60.0" y="794.3" font-family="DejaVu Sans" font-size="12" font-weight="normal" fill="#64748B" text-anchor="start">Модули — тот же Den5_7.exe без окна; права администратора Windows не нужны (адрес 127.0.0.1).</text>
