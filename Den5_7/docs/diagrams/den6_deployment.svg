<text x="1395.0" y="433.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">Скрипты создания (по порядку):</text><text x="1395.0" y="449.7" font-family="DejaVu Sans" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">01_create.sql, 02_data.sql (день 4)</text><text x="1395.0" y="466.3" font-family="DejaVu Sans" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">04_den5.sql, 05_queries.sql (день 5)</text>
