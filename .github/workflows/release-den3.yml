name: День 3 — сборка и релиз

on:
  push:
    branches: [claude/friendly-pascal-4bdlul]
    paths:
      - 'Den3/**'
      - 'Den3.zip'
      - 'RELEASE_DEN3.md'
      - '.github/workflows/release-den3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Сборка Den3
        run: msbuild Den3\Den3.sln /p:Configuration=Release /v:m /nologo

      - name: Архив готовой программы
        shell: pwsh
        run: |
          Remove-Item Den3\Den3\bin\Release\*.pdb -ErrorAction SilentlyContinue
          Copy-Item -Recurse "Den3\Примеры" "Den3\Den3\bin\Release\Примеры"
          Compress-Archive -Path Den3\Den3\bin\Release\* -DestinationPath Den3_exe.zip

      - name: Релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "den3-v1.0"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "День 3: дерево решений (вариант 2)" --notes-file RELEASE_DEN3.md
          } else {
            gh release edit $tag --notes-file RELEASE_DEN3.md
          }
          gh release upload $tag Den3.zip Den3_exe.zip --clobber
