name: Релиз диаграмм (день 4)

on:
  push:
    branches: [ccr-243f62ed-x6fyhm]
    paths: ['Den4/**', 'Den4.zip', '.github/workflows/release-den4.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.1-den4"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes-file Den4/RELEASE.md
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "День 4: диаграммы онлайн-библиотеки" --notes-file Den4/RELEASE.md
          fi
          # GitHub вырезает кириллицу из имён файлов релиза, поэтому прикладываем копии с латинскими именами
          mkdir out
          for ext in png drawio; do
            cp "Den4/Диаграмма_классов.$ext" "out/class-diagram.$ext"
            cp "Den4/Диаграмма_вариантов_использования.$ext" "out/use-case-diagram.$ext"
            cp "Den4/Диаграмма_сущность-связь.$ext" "out/er-diagram.$ext"
          done
          for name in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
            gh release delete-asset "$tag" "$name" --yes
          done
          gh release upload "$tag" Den4.zip out/* --clobber
